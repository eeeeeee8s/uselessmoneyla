<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拍下當買了</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --accent-blue: #0a84ff;
            --accent-green: #30d158;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --danger: #ff453a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
            padding-bottom: 100px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 登入畫面 */
        #loginScreen {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 40px;
        }

        .login-title { font-size: 28px; font-weight: 800; margin-bottom: 40px; background: linear-gradient(to right, #0a84ff, #5e5ce6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .google-btn {
            background: white;
            color: #000;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255,255,255,0.1);
        }

        /* 主程式碼 */
        #mainApp { display: none; width: 100%; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .logout-link { color: var(--danger); font-size: 14px; text-decoration: none; font-weight: 600; cursor: pointer; }

        .input-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .preview-box {
            width: 100%;
            aspect-ratio: 4/3;
            background: #2c2c2e;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #444;
        }

        #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .placeholder-text { color: var(--text-secondary); font-size: 14px; text-align: center; }

        input, select {
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            width: 100%;
        }

        input:focus { border-color: var(--accent-blue); }

        .submit-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        /* 紀錄清單 */
        .log-item {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            position: relative;
        }

        .thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: #333; }
        .info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .item-name { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
        .item-price { color: var(--accent-blue); font-weight: 700; font-size: 14px; }
        .delete-btn { position: absolute; right: 12px; top: 12px; color: #444; font-size: 18px; cursor: pointer; }

        /* 底部欄 */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(28, 28, 30, 0.95);
            backdrop-filter: blur(20px);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            border-top: 0.5px solid #333;
        }

        .stat-group { display: flex; flex-direction: column; }
        .stat-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 18px; font-weight: 700; }
        
        #loadingOverlay { position: fixed; inset:0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 2000; }
    </style>
</head>
<body>

<div id="loadingOverlay">處理中...</div>

<div id="loginScreen">
    <div class="login-title">📸 拍下當買了</div>
    <button class="google-btn" onclick="login()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
        使用 Google 帳號登入
    </button>
    <p style="color: #444; font-size: 12px; margin-top: 20px;">登入後即可跨裝置同步紀錄</p>
</div>

<div id="mainApp" class="app-container">
    <div class="header">
        <h2 style="margin:0; font-size: 20px;">我的省錢紀錄</h2>
        <span class="logout-link" onclick="logout()">登出</span>
    </div>

    <div class="input-card">
        <label for="fileInput" class="preview-box">
            <img id="preview-img" src="" alt="預覽">
            <div id="placeholder" class="placeholder-text">📷 點擊拍照或選取照片</div>
        </label>
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
        
        <input type="text" id="name" placeholder="忍住沒買的物品名稱">
        
        <div style="display: flex; gap: 8px;">
            <select id="currency" style="flex: 1;">
                <option value="HKD">HKD</option>
                <option value="JPY">JPY</option>
                <option value="TWD">TWD</option>
            </select>
            <input type="number" id="price" placeholder="金額" style="flex: 2;">
        </div>
        
        <button class="submit-btn" onclick="saveData()">存入雲端</button>
    </div>

    <div id="list"></div>
</div>

<div class="tab-bar" id="tabBar" style="display: none;">
    <div class="stat-group">
        <span class="stat-label">已忍住</span>
        <span id="totalCount" class="stat-value">0 次</span>
    </div>
    <div class="stat-group" style="align-items: flex-end;">
        <span class="stat-label">累計省下</span>
        <span id="totalMoney" class="stat-value" style="color: var(--accent-green);">HK$ 0</span>
    </div>
</div>

<script>
    // ⚠️ 請務必填入你自己的金鑰 ⚠️
    const firebaseConfig = {
        apiKey: "AIzaSyDoRrfo-cjB0Bdxm5RQIykaMtT54-6MEqc",
        authDomain: "uselessmoneyla.firebaseapp.com",
        projectId: "uselessmoneyla",
        storageBucket: "uselessmoneyla.firebasestorage.app",
        messagingSenderId: "927929088152",
  appId: "1:927929088152:web:c78a0766b565b6ce8a78ed",
  measurementId: "G-T8H0E228SS"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let userUID = null;
    let base64Image = "";

    // 登入狀態監控
    auth.onAuthStateChanged(user => {
        if (user) {
            userUID = user.uid;
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('tabBar').style.display = 'flex';
            fetchData();
        } else {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('tabBar').style.display = 'none';
        }
    });

    async function login() {
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithRedirect(provider);
    }

    async function logout() { await auth.signOut(); }

    // 處理圖片
    document.getElementById('fileInput').onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = event => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const scale = Math.min(1, 400 / img.width);
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                base64Image = canvas.toDataURL('image/jpeg', 0.6);
                document.getElementById('preview-img').src = base64Image;
                document.getElementById('preview-img').style.display = 'block';
                document.getElementById('placeholder').style.display = 'none';
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    };

    // 儲存資料
    async function saveData() {
        const name = document.getElementById('name').value;
        const price = document.getElementById('price').value;
        if (!name || !price) return alert("請填寫名稱和金額");

        document.getElementById('loadingOverlay').style.display = 'flex';
        try {
            await db.collection('users').doc(userUID).collection('records').add({
                name,
                price: parseFloat(price),
                currency: document.getElementById('currency').value,
                image: base64Image,
                time: firebase.firestore.FieldValue.serverTimestamp()
            });
            document.getElementById('name').value = "";
            document.getElementById('price').value = "";
            document.getElementById('preview-img').style.display = 'none';
            document.getElementById('placeholder').style.display = 'block';
            base64Image = "";
        } catch (e) { alert("儲存失敗"); }
        document.getElementById('loadingOverlay').style.display = 'none';
    }

    // 抓取資料
    function fetchData() {
        db.collection('users').doc(userUID).collection('records').orderBy('time', 'desc').onSnapshot(snap => {
            let html = '';
            let total = 0;
            snap.forEach(doc => {
                const d = doc.data();
                total += d.price;
                html += `
                    <div class="log-item">
                        <img class="thumb" src="${d.image || ''}">
                        <div class="info">
                            <div class="item-name">${d.name}</div>
                            <div class="item-price">${d.currency} ${d.price}</div>
                        </div>
                        <div class="delete-btn" onclick="deleteItem('${doc.id}')">×</div>
                    </div>
                `;
            });
            document.getElementById('list').innerHTML = html;
            document.getElementById('totalCount').innerText = snap.size + " 次";
            document.getElementById('totalMoney').innerText = "HK$ " + total.toLocaleString();
        });
    }

    async function deleteItem(id) {
        if(confirm("確定刪除？")) await db.collection('users').doc(userUID).collection('records').doc(id).delete();
    }
</script>
</body>
</html>
