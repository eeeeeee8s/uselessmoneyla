<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>慳啲啦baby💅🏻✨</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #000000; --box-bg: #1c1c1e; --theme-main: #0a84ff;  
            --theme-green: #32d74b; --text-main: #ffffff; --text-sub: #888888; --error-red: #ff453a;   
        }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding: 20px; margin: 0; padding-bottom: 90px; padding-top: calc(10px + env(safe-area-inset-top)); }
        .container { max-width: 400px; margin: auto; display: flex; flex-direction: column; gap: 15px; }
        
        /* 登入畫面優化 */
        #loginScreen { position: fixed; top:0; left:0; right:0; bottom:0; background: var(--bg-dark); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; box-sizing: border-box; }
        .login-box { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 15px; }
        .login-input { background: var(--box-bg); border: 1px solid #333; border-radius: 12px; padding: 18px; color: white; font-size: 16px; outline: none; transition: 0.2s; }
        .login-input:focus { border-color: var(--theme-main); }
        
        .smart-btn { background: var(--theme-main); color: white; padding: 18px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; font-size: 18px; margin-top: 5px; box-shadow: 0 4px 15px rgba(10, 132, 255, 0.3); }
        .hint-text { color: var(--text-sub); font-size: 13px; text-align: center; line-height: 1.5; margin-top: 5px; }
        
        #errorMsg { color: var(--error-red); background: rgba(255,69,58,0.1); padding: 12px; border-radius: 10px; text-align: center; font-size: 14px; display: none; font-weight: 500; }
        .divider { display: flex; align-items: center; color: #555; margin: 20px 0; font-size: 12px; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #333; margin: 0 15px; }
        .google-btn { background: white; color: black; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        /* 主畫面樣式 */
        #mainApp { display: none; } 
        #loadingOverlay { position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.85); z-index:10000; display:none; color:white; font-size:18px; align-items:center; justify-content:center; flex-direction:column; gap:15px; }
        .header-title { display: flex; justify-content: space-between; align-items: center; font-size: 24px; font-weight: 800; margin-bottom: 10px; color: var(--theme-main); letter-spacing: -0.5px; }
        .logout-btn { font-size: 14px; color: var(--error-red); cursor: pointer; background: none; border: none; font-weight: 600; opacity: 0.8; }

        .input-group { background: var(--box-bg); border: 1px solid #2c2c2e; border-radius: 14px; padding: 16px; display: flex; align-items: center; }
        .input-group:focus-within { border-color: var(--theme-main); }
        input { background: transparent; border: none; color: var(--text-main); font-size: 16px; outline: none; width: 100%; }
        .currency-select { background: transparent; color: white; border: none; font-size: 16px; font-weight: bold; outline: none; padding-right: 15px; margin-right: 15px; border-right: 1px solid #444; appearance: none; -webkit-appearance: none; }
        
        #preview-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 14px; display: none; margin-bottom: 8px; border: 1px solid #333; }
        .action-btn { width: 100%; padding: 18px; border-radius: 14px; font-size: 18px; font-weight: bold; border: none; color: white; margin-top: 5px; box-shadow: 0 4px 15px rgba(10, 132, 255, 0.2); }
        .btn-main { background: var(--theme-main); }
        
        .log-list { margin-top: 10px; display: flex; flex-direction: column; gap: 12px; }
        .log-item { background: var(--box-bg); border-radius: 14px; padding: 16px; position: relative; display: flex; gap: 15px; border: 1px solid #2c2c2e; }
        .log-img-box { width: 65px; height: 65px; border-radius: 10px; background: #2c2c2e; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .log-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .log-info { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-right: 20px; }
        .log-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--text-main); }
        .log-hkd-price { font-size: 18px; font-weight: 800; color: var(--theme-main); }
        .icon-btn.del { color: #444; background:none; border:none; font-size:18px; position: absolute; right: 15px; top: 15px; }

        .summary-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(28, 28, 30, 0.96); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 15px 25px; border-top: 1px solid #333; display: flex; justify-content: space-between; align-items: center; padding-bottom: calc(15px + env(safe-area-inset-bottom)); z-index: 100; }
        .stat-val-count { font-size: 20px; font-weight: 800; color: white; }
        .stat-val-total { font-size: 22px; font-weight: 800; color: var(--theme-main); }
    </style>
</head>
<body>

<div id="loginScreen">
    <h1 style="color: var(--theme-main); margin-bottom: 30px; font-size: 32px; letter-spacing: -1px;">慳啲啦baby💅🏻✨</h1>
    
    <div class="login-box">
        <div id="errorMsg"></div>

        <input type="email" id="loginEmail" class="login-input" placeholder="你的電子郵件">
        <input type="password" id="loginPassword" class="login-input" placeholder="密碼 (至少 6 位數)">
        
        <button class="smart-btn" onclick="handleSmartLogin()">進入我的小金庫</button>
        
        <div class="hint-text">
            ✨ 第一次用？直接填寫資料就註冊好囉！<br>
            ✨ 舊用戶也是直接填寫即可登入。
        </div>

        <div class="divider">或使用</div>

        <button class="google-btn" onclick="googleLogin()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20" height="20">
            Google 帳號登入
        </button>
    </div>
</div>

<div id="loadingOverlay">
    <div style="width: 30px; height: 30px; border: 3px solid var(--theme-main); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
    <span>正在努力載入中...</span>
</div>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>

<div id="mainApp" class="container">
    <div class="header-title">
        <span>慳啲啦baby💅🏻✨</span>
        <button class="logout-btn" onclick="logout()">登出</button>
    </div>

    <img id="preview-img">
    
    <div class="input-group" style="justify-content: center; padding: 20px; border-style: dashed; border-color: #444;">
        <label class="upload-label" style="color: var(--theme-main); font-weight: 600;">
            📷 點此拍照或選取照片
            <input type="file" id="photoUpload" accept="image/*" style="display:none;">
        </label>
    </div>

    <div class="input-group">
        <input type="text" id="itemName" placeholder="忍住不買的東西是？">
    </div>
    
    <div class="input-group">
        <select class="currency-select" id="currencySelect">
            <option value="HKD">HKD</option>
            <option value="JPY">JPY</option>
            <option value="TWD">TWD</option>
            <option value="USD">USD</option>
        </select>
        <input type="number" id="itemPrice" placeholder="標價多少？" inputmode="decimal">
    </div>

    <button class="action-btn btn-main" onclick="saveToCloud()">假裝買了！存入雲端</button>

    <div class="log-list" id="recordList"></div>
</div>

<div class="summary-bar">
    <div style="display:flex; flex-direction:column;">
        <span style="font-size:12px; color:var(--text-sub); margin-bottom:2px;">忍住次數</span>
        <span class="stat-val-count" id="sumCount">0 次</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end;">
        <span style="font-size:12px; color:var(--text-sub); margin-bottom:2px;">成功省下</span>
        <span class="stat-val-total" id="sumTotal">HK$ 0.00</span>
    </div>
</div>

<script>
    function showErr(msg) {
        const errDiv = document.getElementById('errorMsg');
        errDiv.innerText = msg;
        errDiv.style.display = 'block';
        setTimeout(() => { errDiv.style.display = 'none'; }, 5000);
    }

    // === 1. 你的 Firebase 設定 ===
    const firebaseConfig = {
        apiKey: "AIzaSyDoRrfo-cjB0Bdxm5RQIykaMtT54-6MEqc",
        authDomain: "uselessmoneyla.firebaseapp.com",
        projectId: "uselessmoneyla",
        storageBucket: "uselessmoneyla.firebasestorage.app",
        messagingSenderId: "927929088152",
        appId: "1:927929088152:web:c78a0766b565b6ce8a78ed" 
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentPhotoBase64 = "";

    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = user;
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            loadData();
        } else {
            currentUser = null;
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
        }
    });

    // ✨ 智能登入/註冊邏輯
    async function handleSmartLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const pass = document.getElementById('loginPassword').value;
        
        if(!email || pass.length < 6) return showErr("請填寫正確電郵，且密碼至少 6 位數喔！");
        
        document.getElementById('loadingOverlay').style.display = 'flex';
        
        try {
            // 先嘗試登入
            await auth.signInWithEmailAndPassword(email, pass);
        } catch (error) {
            // 如果報錯是「找不到用戶」，就自動幫他註冊
            if (error.code === 'auth/user-not-found') {
                try {
                    await auth.createUserWithEmailAndPassword(email, pass);
                } catch (regError) {
                    showErr("註冊失敗：" + regError.message);
                }
            } else if (error.code === 'auth/wrong-password') {
                showErr("密碼輸入錯誤喔！如果是新用戶，請換個電郵試試。");
            } else {
                showErr("登入失敗：" + error.message);
            }
        }
        document.getElementById('loadingOverlay').style.display = 'none';
    }

    function googleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithRedirect(provider);
    }

    function logout() { auth.signOut(); }

    document.getElementById('photoUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 400;
                let width = img.width, height = img.height;
                if (width > MAX_WIDTH) { height = height * (MAX_WIDTH / width); width = MAX_WIDTH; }
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
                document.getElementById('preview-img').src = currentPhotoBase64;
                document.getElementById('preview-img').style.display = 'block';
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });

    async function saveToCloud() {
        if (!currentUser) return;
        const name = document.getElementById('itemName').value;
        const price = parseFloat(document.getElementById('itemPrice').value);
        if (!name || isNaN(price)) return alert("記得寫上名稱跟價錢喔！💅🏻");

        document.getElementById('loadingOverlay').style.display = 'flex';
        try {
            await db.collection("users").doc(currentUser.uid).collection("records").add({
                name: name,
                price: price,
                photoUrl: currentPhotoBase64,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            currentPhotoBase64 = '';
            document.getElementById('preview-img').style.display = 'none';
        } catch (e) { alert("存檔失敗了..."); }
        document.getElementById('loadingOverlay').style.display = 'none';
    }

    function loadData() {
        db.collection("users").doc(currentUser.uid).collection("records")
          .orderBy("createdAt", "desc")
          .onSnapshot(snap => {
            let html = ''; let total = 0; let count = 0;
            snap.forEach(doc => {
                const r = doc.data();
                count++; total += r.price;
                html += `
                <div class="log-item">
                    <div class="log-img-box">${r.photoUrl ? `<img src="${r.photoUrl}">` : '🚫'}</div>
                    <div class="log-info">
                        <div class="log-title">${r.name}</div>
                        <div class="log-hkd-price">HK$ ${r.price.toFixed(2)}</div>
                    </div>
                    <button class="icon-btn del" onclick="deleteItem('${doc.id}')">✕</button>
                </div>`;
            });
            document.getElementById('recordList').innerHTML = html;
            document.getElementById('sumTotal').innerText = `HK$ ${total.toFixed(2)}`;
            document.getElementById('sumCount').innerText = `${count} 次`;
          });
    }

    function deleteItem(id) {
        if(confirm("確定要刪除這筆紀錄嗎？")) db.collection("users").doc(currentUser.uid).collection("records").doc(id).delete();
    }
</script>
</body>
</html>
