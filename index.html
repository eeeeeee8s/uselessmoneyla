<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拍下當買了 (雲端連線版)</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #000000;
            --box-bg: #1c1c1e;
            --theme-main: #0a84ff;  
            --theme-green: #32d74b; 
            --text-main: #ffffff;
            --text-sub: #888888;
            --error-red: #ff453a;   
        }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding: 15px; margin: 0; padding-bottom: 80px; }
        .container { max-width: 400px; margin: auto; display: flex; flex-direction: column; gap: 12px; }
        
        /* 登入畫面 */
        #loginScreen { position: fixed; top:0; left:0; right:0; bottom:0; background: var(--bg-dark); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .login-box { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 15px; }
        .login-input { background: #222; border: 1px solid #444; border-radius: 10px; padding: 12px; color: white; font-size: 16px; outline: none; }
        .login-input:focus { border-color: var(--theme-main); }
        .email-btn { background: var(--theme-main); color: white; padding: 12px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; }
        .reg-link { color: var(--text-sub); font-size: 13px; text-align: center; text-decoration: underline; cursor: pointer; }
        
        .divider { display: flex; align-items: center; color: #444; margin: 10px 0; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #333; margin: 0 10px; }

        .google-btn { background: white; color: black; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        #mainApp { display: none; } 
        #loadingOverlay { position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.8); z-index:10000; display:none; color:white; font-size:20px; align-items:center; justify-content:center; }

        /* 標題與登出 */
        .header-title { display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: bold; margin-bottom: 5px; color: var(--theme-main); }
        .logout-btn { font-size: 14px; color: var(--error-red); cursor: pointer; background: none; border: none; font-weight: bold; }

        /* 其他原本的 CSS */
        .input-group { border: 2px solid #333; border-radius: 10px; padding: 12px; display: flex; align-items: center; background: var(--bg-dark); margin-bottom: 10px; }
        input, select { background: transparent; border: none; color: var(--text-main); font-size: 16px; outline: none; width: 100%; }
        .action-btn { width: 100%; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; border: none; color: white; }
        .btn-main { background: var(--theme-main); }
        .log-list { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .log-item { background: var(--box-bg); border-radius: 10px; padding: 15px; border-left: 5px solid var(--theme-main); position: relative; display: flex; gap: 15px; }
        .log-img-box { width: 70px; height: 70px; border-radius: 8px; background: #222; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .log-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .log-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .log-title { font-size: 16px; font-weight: bold; margin-bottom: 4px; color: var(--text-main); }
        .log-hkd-price { font-size: 16px; font-weight: bold; color: var(--theme-main); }
        .log-actions { position: absolute; right: 10px; top: 10px; }
        .icon-btn.del { color: var(--error-red); background:none; border:none; font-size:16px; }

        .summary-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #111; padding: 15px 20px; border-top: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        
        .ver-tag { position: absolute; bottom: 10px; font-size: 10px; color: #333; }
    </style>
</head>
<body>

<div id="loginScreen">
    <h1 style="color: var(--theme-main); margin-bottom: 30px;">📸 拍下當買了</h1>
    
    <div class="login-box">
        <input type="email" id="loginEmail" class="login-input" placeholder="電子郵件">
        <input type="password" id="loginPassword" class="login-input" placeholder="密碼">
        <button class="email-btn" onclick="emailLogin()">登入</button>
        <span class="reg-link" onclick="emailRegister()">還沒帳號？點此註冊</span>

        <div class="divider">或者</div>

        <button class="google-btn" onclick="googleLogin()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20" height="20">
            使用 Google 登入
        </button>
    </div>

    <div class="ver-tag">Version 2.0 (Email Support)</div>
</div>

<div id="loadingOverlay">雲端處理中...</div>

<div id="mainApp" class="container">
    <div class="header-title">
        <span>📸 拍下當買了</span>
        <button class="logout-btn" onclick="logout()">登出</button>
    </div>

    <img id="preview-img" style="width:100%; max-height:250px; object-fit:cover; border-radius:10px; display:none; margin-bottom:10px;">
    <div class="input-group">
        <label style="width:100%; text-align:center; color:var(--text-sub); cursor:pointer;">
            📷 點此拍照或選取照片
            <input type="file" id="photoUpload" accept="image/*" style="display:none;">
        </label>
    </div>

    <div class="input-group">
        <input type="text" id="itemName" placeholder="忍住不買的東西是？">
    </div>
    
    <div class="input-group">
        <input type="number" id="itemPrice" placeholder="標價多少 (HKD)？" inputmode="decimal">
    </div>

    <button class="action-btn btn-main" onclick="saveToCloud()">假裝買了！存入雲端</button>

    <div class="log-list" id="recordList"></div>
</div>

<div class="summary-bar">
    <div style="display:flex; flex-direction:column;">
        <span style="font-size:12px; color:var(--text-sub);">成功省下</span>
        <span id="sumTotal" style="font-size:22px; font-weight:bold; color:var(--theme-main);">HK$ 0.00</span>
    </div>
</div>

<script>
    // === 1. 你的 Firebase 設定 (請補齊最後兩行) ===
    const firebaseConfig = {
        apiKey: "AIzaSyDoRrfo-cjB0Bdxm5RQIykaMtT54-6MEqc",
        authDomain: "uselessmoneyla.firebaseapp.com",
        projectId: "uselessmoneyla",
        storageBucket: "uselessmoneyla.firebasestorage.app",
        messagingSenderId: "927929088152",
  appId: "1:927929088152:web:c78a0766b565b6ce8a78ed",
  measurementId: "G-T8H0E228SS"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentPhotoBase64 = "";

    // === 2. 登入邏輯 ===

    // 監聽登入狀態
    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = user;
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            loadData();
        } else {
            currentUser = null;
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
        }
    });

    // Google 登入
    function googleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithRedirect(provider);
    }

    // 電郵登入
    function emailLogin() {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPassword').value;
        if(!email || !pass) return alert("請填寫電郵和密碼");
        auth.signInWithEmailAndPassword(email, pass).catch(err => alert("登入失敗：" + err.message));
    }

    // 電郵註冊
    function emailRegister() {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPassword').value;
        if(!email || pass.length < 6) return alert("請填寫有效的電郵，且密碼需至少6位");
        auth.createUserWithEmailAndPassword(email, pass).then(() => alert("註冊成功！已自動登入")).catch(err => alert("註冊失敗：" + err.message));
    }

    function logout() { auth.signOut(); }

    // === 3. 功能邏輯 (存檔與讀取) ===

    // 照片預覽與壓縮
    document.getElementById('photoUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 400;
                let width = img.width, height = img.height;
                if (width > MAX_WIDTH) { height = height * (MAX_WIDTH / width); width = MAX_WIDTH; }
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
                document.getElementById('preview-img').src = currentPhotoBase64;
                document.getElementById('preview-img').style.display = 'block';
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });

    async function saveToCloud() {
        if (!currentUser) return;
        const name = document.getElementById('itemName').value;
        const price = parseFloat(document.getElementById('itemPrice').value);
        if (!name || isNaN(price)) return alert("請填寫名稱和價錢");

        document.getElementById('loadingOverlay').style.display = 'flex';
        try {
            await db.collection("users").doc(currentUser.uid).collection("records").add({
                name: name,
                price: price,
                photoUrl: currentPhotoBase64,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            currentPhotoBase64 = '';
            document.getElementById('preview-img').style.display = 'none';
        } catch (e) { alert("儲存失敗"); }
        document.getElementById('loadingOverlay').style.display = 'none';
    }

    function loadData() {
        db.collection("users").doc(currentUser.uid).collection("records")
          .orderBy("createdAt", "desc")
          .onSnapshot(snap => {
            let html = ''; let total = 0;
            snap.forEach(doc => {
                const r = doc.data();
                total += r.price;
                html += `
                <div class="log-item">
                    <div class="log-img-box">${r.photoUrl ? `<img src="${r.photoUrl}">` : '🚫'}</div>
                    <div class="log-info">
                        <div class="log-title">${r.name}</div>
                        <div class="log-hkd-price">HK$ ${r.price.toFixed(2)}</div>
                    </div>
                    <div class="log-actions">
                        <button class="icon-btn del" onclick="deleteItem('${doc.id}')">✕</button>
                    </div>
                </div>`;
            });
            document.getElementById('recordList').innerHTML = html;
            document.getElementById('sumTotal').innerText = `HK$ ${total.toFixed(2)}`;
          });
    }

    function deleteItem(id) {
        if(confirm("確定刪除？")) db.collection("users").doc(currentUser.uid).collection("records").doc(id).delete();
    }
</script>
</body>
</html>
